# ─── Live deploy — FreshGreen-OS (main branch) ────────────────────────────────
# Builds to Artifact Registry and deploys to the live Cloud Run service `fgos`,
# which fgos.freshgreenclassics.co.uk points at.
#
# This replaces the old gcr.io/ Container Registry flow in cloudbuild.yaml.
# Google Container Registry (gcr.io) is retired and rejects new pushes, so the
# image now goes to Artifact Registry — the same registry the live service already
# pulls from (cloud-run-source-deploy/fgos).
#
# Manual deploy (this is what runs today; there is no automatic trigger yet):
#   gcloud builds submit --config=cloudbuild-live.yaml --region=europe-west1 .
#
# To add automation later, create a GitHub trigger bound to the `main` branch
# pointing at this file. Pair it with cloudbuild-staging.yaml bound to `staging`
# so an unverified commit cannot reach production.
steps:
  # 1. Build the container image into Artifact Registry.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fgos:${_TAG}',
        '-t',
        'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fgos:latest',
        '.',
      ]

  # 2. Push both tags.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fgos:${_TAG}'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fgos:latest'

  # 3. Deploy to Cloud Run.
  #
  #    CRITICAL: do NOT use a bare `--set-env-vars` here. `--set-env-vars`
  #    REPLACES the service's entire environment, so a partial list silently
  #    deletes every credential the service needs (GEMINI_API_KEY,
  #    MAILERLITE_API_KEY, DGC_NOTIFY_SECRET…). That happened on 2026-10-09 and
  #    took live AI down. The flag is therefore omitted entirely below — Cloud
  #    Run preserves the service's existing environment when it is absent.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'fgos'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fgos:${_TAG}'
      - '--platform=managed'
      - '--region=europe-west1'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      # NOTE: no --set-env-vars flag here, deliberately. Cloud Run keeps the
      # service's existing environment when the flag is absent. Passing it
      # REPLACES the whole env list — that wiped GEMINI_API_KEY,
      # MAILERLITE_API_KEY and DGC_NOTIFY_SECRET on 2026-10-09 and took live AI
      # down. If you ever must change env, pass EVERY key in one call.

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fgos:${_TAG}'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fgos:latest'

# Manual submits have no $SHORT_SHA, so the tag is passed explicitly:
#   gcloud builds submit --config=cloudbuild-live.yaml --region=europe-west1 \
#     --substitutions=_TAG=$(git rev-parse --short HEAD) .
# GitHub triggers can omit it and rely on the default.
substitutions:
  # Manual submits pass --substitutions=_TAG=<sha>; GitHub triggers can omit it.
  _TAG: 'latest'
